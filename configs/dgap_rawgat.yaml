attack: agnostic
mode: dgap
checkpoint: models/model300000.pt

# Attack-agnostic DGAP config (used for all attacks; the defender has no
# knowledge of the attack at test time).
# Selected by calibrate.py on the development split (N=500, 15-level grid)
# DEV AVG y = 11.02% across 3 attacks (pgd_l2 15.83, cw 4.21, linf 13.02)
gate:
  t: 60
  tau: 2.2194    # mu + gamma*sigma where mu=+0.2567, sigma=0.8646, gamma=2.27

defense:
  t_score: 300
